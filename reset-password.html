<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fliqs — Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #ccc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 400px;
      width: 100%;
      background: #1a1a1a;
      border-radius: 14px;
      padding: 32px 24px;
      border: 1px solid #2a2a2a;
    }
    .logo { font-size: 48px; text-align: center; margin-bottom: 8px; }
    h1 { color: #fff; font-size: 22px; text-align: center; margin-bottom: 6px; }
    .subtitle { color: #666; font-size: 13px; text-align: center; margin-bottom: 28px; }
    label { display: block; color: #888; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 6px; text-transform: uppercase; }
    input {
      width: 100%;
      background: #111;
      color: #fff;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
    }
    input:focus { border-color: #E85D3A; }
    .btn {
      width: 100%;
      background: #E85D3A;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn:hover:not(:disabled) { opacity: 0.9; }
    .message {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
    }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .hint { color: #555; font-size: 12px; margin-top: 4px; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #E85D3A;
      text-decoration: none;
      font-size: 14px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🎬</div>
    <h1>Reset Password</h1>
    <p class="subtitle">Enter your new password below</p>

    <div id="form-section">
      <label for="password">New Password</label>
      <input type="password" id="password" placeholder="Enter new password (6+ characters)" minlength="6" />

      <label for="confirm">Confirm Password</label>
      <input type="password" id="confirm" placeholder="Confirm new password" />

      <button class="btn" id="submit-btn" onclick="resetPassword()">Update Password</button>

      <div id="message" class="message"></div>
    </div>

    <div id="success-section" class="hidden">
      <div class="message success">
        <p style="font-size: 32px; margin-bottom: 12px;">✅</p>
        <p>Your password has been updated!</p>
        <p style="color: #888; margin-top: 8px; font-size: 13px;">You can now open the Fliqs app and sign in with your new password.</p>
      </div>
    </div>

    <div id="error-section" class="hidden">
      <div class="message error">
        <p style="font-size: 32px; margin-bottom: 12px;">❌</p>
        <p id="error-text">This reset link has expired or is invalid.</p>
        <p style="color: #888; margin-top: 8px; font-size: 13px;">Please request a new password reset from the Fliqs app.</p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://anlffjplzakfivpjlmfs.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFubGZmanBsemFrZml2cGpsbWZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5Nzg4NDAsImV4cCI6MjA5MjU1NDg0MH0.lCgZabaklZ8yjs19GO1M4CSzwnywzPbkaCSMVzbUSHE'

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    // Check if we have a valid session from the reset link
    async function init() {
      const hash = window.location.hash
      if (!hash || !hash.includes('access_token')) {
        // No token in URL — check if there's one in query params (some Supabase versions use different formats)
        const params = new URLSearchParams(window.location.search)
        const error = params.get('error')
        const errorDescription = params.get('error_description')
        if (error) {
          showError(errorDescription || 'This reset link has expired or is invalid.')
          return
        }
      }

      // Supabase JS client auto-picks up the tokens from the URL hash
      const { data: { session }, error } = await supabase.auth.getSession()
      if (error || !session) {
        // Try to exchange the hash params
        const hashParams = new URLSearchParams(hash.substring(1))
        const accessToken = hashParams.get('access_token')
        const refreshToken = hashParams.get('refresh_token')
        if (accessToken && refreshToken) {
          const { error: setError } = await supabase.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken,
          })
          if (setError) {
            showError('This reset link has expired or is invalid.')
            return
          }
        } else {
          showError('This reset link has expired or is invalid.')
          return
        }
      }
    }

    async function resetPassword() {
      const password = document.getElementById('password').value
      const confirm = document.getElementById('confirm').value
      const btn = document.getElementById('submit-btn')
      const msg = document.getElementById('message')

      if (!password || password.length < 6) {
        msg.className = 'message error'
        msg.textContent = 'Password must be at least 6 characters.'
        return
      }
      if (password !== confirm) {
        msg.className = 'message error'
        msg.textContent = 'Passwords do not match.'
        return
      }

      btn.disabled = true
      btn.textContent = 'Updating...'
      msg.textContent = ''

      const { error } = await supabase.auth.updateUser({ password })

      if (error) {
        btn.disabled = false
        btn.textContent = 'Update Password'
        msg.className = 'message error'
        msg.textContent = error.message || 'Failed to update password. Please try again.'
      } else {
        document.getElementById('form-section').classList.add('hidden')
        document.getElementById('success-section').classList.remove('hidden')
      }
    }

    function showError(text) {
      document.getElementById('form-section').classList.add('hidden')
      document.getElementById('error-text').textContent = text
      document.getElementById('error-section').classList.remove('hidden')
    }

    // Handle Enter key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') resetPassword()
    })

    init()
  </script>
</body>
</html>
